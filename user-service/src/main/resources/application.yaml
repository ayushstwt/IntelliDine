server:
  port: ${PORT:${SERVER_PORT:6060}}

spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}
  jpa:
    show-sql: ${SHOW_SQL:true}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

eureka:
  client:
    register-with-eureka: ${REGISTER_WITH_EUREKA:true}
    fetch-registry: ${FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${DEFAULT_ZONE:http://localhost:8761/eureka/}}

rsa:
  public-key: ${RSA_PUBLIC_KEY:classpath:certs/public.pem}
  private-key: ${RSA_PRIVATE_KEY:classpath:certs/private.pem}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
