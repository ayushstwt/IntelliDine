server:
  port: ${PORT:${SERVER_PORT:6060}}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:staging-postgres.intellidine.internal}:${DB_PORT:5432}/${DB_NAME:users_db}?sslmode=require}
    username: ${DB_USERNAME:postgres_stag}
    password: ${DB_PASSWORD:stagpassword}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.hunger.saviour: INFO
