server:
  port: ${PORT:${SERVER_PORT:9091}}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:dev-postgres.intellidine.local}:${DB_PORT:5434}/${DB_NAME:payments_db}}
    username: ${DB_USERNAME:postgres_dev}
    password: ${DB_PASSWORD:devpassword}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:dev-kafka:9092}

logging:
  level:
    root: INFO
    com.hunger.saviour: DEBUG
