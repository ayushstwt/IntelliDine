server:
  port: ${PORT:${SERVER_PORT:9093}}

spring:
  application:
    name: ai-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  client:
    register-with-eureka: ${REGISTER_WITH_EUREKA:true}
    fetch-registry: ${FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${DEFAULT_ZONE:http://localhost:8761/eureka/}}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://intellidine-ai.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY:local-dev-api-key}
    model: ${AZURE_OPENAI_MODEL:gpt-4o-mini}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:intellidine-gpt4o}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:1000}
    timeout-ms: ${AI_TIMEOUT_MS:30000}

logging:
  level:
    root: INFO
    com.intellidine: DEBUG
