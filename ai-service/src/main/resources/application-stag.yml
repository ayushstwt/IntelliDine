server:
  port: ${PORT:${SERVER_PORT:9093}}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api-key: ${AZURE_OPENAI_API_KEY}
    model: ${AZURE_OPENAI_MODEL:gpt-4o}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-staging}
    temperature: ${AI_TEMPERATURE:0.5}
    max-tokens: ${AI_MAX_TOKENS:1500}

logging:
  level:
    root: INFO
    com.intellidine: INFO
