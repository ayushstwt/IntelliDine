server:
  port: ${PORT:${SERVER_PORT:9093}}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://intellidine-ai-dev.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY}
    model: ${AZURE_OPENAI_MODEL:gpt-4o-mini}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini-dev}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:1000}

logging:
  level:
    root: INFO
    com.intellidine: DEBUG
