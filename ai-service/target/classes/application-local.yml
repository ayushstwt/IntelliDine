server:
  port: ${PORT:${SERVER_PORT:9093}}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://intellidine-ai-local.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY:mock-local-key}
    model: ${AZURE_OPENAI_MODEL:gpt-4o-mini}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini-local}
    temperature: 0.7
    max-tokens: 1000

logging:
  level:
    root: INFO
    com.hunger.saviour.ai: DEBUG
