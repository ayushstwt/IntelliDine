server:
  port: ${PORT:${SERVER_PORT:8761}}

spring:
  application:
    name: registry-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  client:
    register-with-eureka: ${REGISTER_WITH_EUREKA:false}
    fetch-registry: ${FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${DEFAULT_ZONE:http://localhost:8761/eureka/}}

logging:
  level:
    root: INFO