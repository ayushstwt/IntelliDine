server:
  port: ${PORT:${SERVER_PORT:9092}}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:prod-db-cluster.intellidine.internal}:${DB_PORT:5435}/${DB_NAME:orders_db}?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

logging:
  level:
    root: WARN
    com.hunger.saviour: INFO
